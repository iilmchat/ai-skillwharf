# Staging: production-подобная конфигурация поверх базового docker-compose.yml.
#
# Запуск (все переменные ниже обязательны — в .env должны быть реальные ключи):
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#     --profile production up -d --build
#
# Мониторинг добавляется профилем monitoring:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#     --profile production --profile monitoring up -d
#
# Отличия от dev:
# * наружу открыты только 80/443 (Caddy); api, postgres и web слушают
#   исключительно 127.0.0.1;
# * критичные переменные объявлены через ${VAR:?}: без значения в .env
#   compose падает ещё до запуска контейнеров;
# * LLM и биллинг без mock-провайдеров: пустые ключи не превращаются в
#   заглушку;
# * Caddy получает сертификат Let's Encrypt; по умолчанию используется
#   staging-CA, чтобы не расходовать лимиты production-CA.
services:
  postgres:
    ports:
      # Наружу БД не публикуется, только localhost для отладки.
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}

  api:
    ports:
      # API доступен только через Caddy и с localhost для диагностики.
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required in .env}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required in .env}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required in .env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required in .env}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:?YOOKASSA_SHOP_ID is required in .env}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:?YOOKASSA_SECRET_KEY is required in .env}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:?YOOKASSA_RETURN_URL is required in .env}
      # Без mock_key/mock_token: ключи навыков должны быть реальными.
      TAVILY_API_KEY: ${TAVILY_API_KEY:?TAVILY_API_KEY is required in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required in .env}
      SANDBOX_ALLOW_NETWORK: "false"
      SANDBOX_WORKER_URL: http://sandbox-worker:4000

  sandbox-worker:
    environment:
      SANDBOX_ALLOW_NETWORK: "false"

  web:
    ports:
      # Web доступен только через Caddy и с localhost для диагностики.
      - "127.0.0.1:8080:80"

  prometheus:
    environment:
      # Без этих значений мониторинг не стартует: пароль и bcrypt-хэш
      # задаются только в .env, в git их нет.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required in .env}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required in .env}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:?MONITORING_BASIC_AUTH_HASH is required in .env}
      # Публичный URL нужен Prometheus для корректных ссылок за Caddy.
      PROMETHEUS_EXTERNAL_URL: https://${DOMAIN:?DOMAIN is required in .env}/prometheus/

  grafana:
    environment:
      # Grafana доступна через Caddy по /grafana/; admin-пароль не admin.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in .env}
      GF_SERVER_ROOT_URL: https://${DOMAIN:?DOMAIN is required in .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Datasource Grafana → Prometheus использует нативную Basic Auth.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required in .env}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required in .env}

  caddy:
    # Для голого IP нужен self-signed сертификат: Let's Encrypt не выпускает
    # сертификаты на IP. Если задан домен, замените Caddyfile.staging на
    # deploy/Caddyfile и уберите command ниже.
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.staging
      - --adapter
      - caddyfile
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required in .env}
      # Let's Encrypt staging: сертификат недоверенный, лимиты не расходуются.
      # Для боевого домена задайте https://acme-v02.api.letsencrypt.org/directory.
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      # Basic Auth для /grafana/ и /prometheus/ на edge.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required in .env}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:?MONITORING_BASIC_AUTH_HASH is required in .env}
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile.staging:ro
