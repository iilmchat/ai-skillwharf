# Staging: production-подобная конфигурация поверх базового docker-compose.yml.
#
# Базовый запуск (api, web, postgres, redis, воркеры — без Caddy и мониторинга):
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Профили включаются отдельно и требуют своих переменных в .env:
#
#   --profile production  Caddy на 80/443 (DOMAIN, ACME_EMAIL, MONITORING_*)
#   --profile monitoring  OTel + Prometheus + Grafana (MONITORING_*, GRAFANA_*)
#   --profile with-llm    локальная Ollama (только 127.0.0.1:11435)
#
# Правила, которые здесь зафиксированы:
# * наружу не смотрит ничего, кроме Caddy (и он включается профилем);
# * API, web, postgres, ollama отдаются только на 127.0.0.1 — для отладки
#   с хоста и через SSH-туннель;
# * restart: always у всех долгоживущих сервисов; у one-shot db-migrate — "no";
# * воркеры ограничены по CPU/RAM, чтобы sandbox не положил хост.
services:
  postgres:
    restart: always
    ports:
      # Только localhost: нужен для отладки с хоста, наружу не публикуется.
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}

  redis:
    restart: always

  llm-worker:
    restart: always
    deploy:
      resources:
        limits:
          # Воркер держит LLM-стримы и BullMQ; без лимита при утечке он
          # забирает всю память WSL2-дистрибутива.
          cpus: "2.0"
          memory: 2G

  api:
    restart: always
    ports:
      # API доступен только через Caddy и с localhost (для отладки и тестов).
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required in .env}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required in .env}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required in .env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required in .env}
      # Платёжка и внешние API опциональны: без них стенд поднимается и
      # принимает /billing/topup, а навыки, которым нужен ключ, просто
      # откажут в рантайме. Для реального прогона заполнить в .env.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:8080/billing/return}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SANDBOX_WORKER_URL: http://sandbox-worker:4000

  sandbox-worker:
    restart: always
    deploy:
      resources:
        limits:
          # Песочница исполняет чужой код: жёсткий лимит обязателен.
          cpus: "1.0"
          memory: 1G
    environment:
      # Egress задаётся egress_allowlist в манифесте навыка (deny by default);
      # глобально флаг не ослабляется. В staging профиль закрыт по умолчанию:
      # без файла политик worker не стартует (fail closed), а файл монтируется
      # из базового docker-compose.yml.
      SANDBOX_SECCOMP_PROFILE: /etc/sandbox/seccomp-profile.json

  db-migrate:
    # One-shot: должен завершиться и не перезапускаться.
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required in .env}?schema=public

  web:
    restart: always
    build:
      args:
        # Staging собирается из текущего дерева, а не из готового образа.
        VITE_RAG_MEMORY_ENABLED: ${VITE_RAG_MEMORY_ENABLED:-false}
    ports:
      - "127.0.0.1:8080:80"

  ollama:
    # Профиль with-llm; публикуется только на localhost, иначе порт открыт
    # всей сети (базовая конфигурация публиковала 11435 на 0.0.0.0).
    restart: always
    ports:
      - "127.0.0.1:11435:11434"

  # Мониторинг остаётся в профиле monitoring. Переменные ниже намеренно
  # опциональны: без профиля они не нужны, а `${VAR:?}` в compose падает на
  # интерполяции даже для незапускаемого сервиса.
  prometheus:
    environment:
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:-}
      PROMETHEUS_EXTERNAL_URL: https://${DOMAIN:-localhost}/prometheus/

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}

  caddy:
    # Профиль production. Для WSL2 без публичного домена не нужен: web и api
    # отдаются на localhost напрямую (см. docs/operations/STAGING-DEPLOY.md).
    restart: always
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.staging
      - --adapter
      - caddyfile
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Let's Encrypt staging: сертификат непроверенный, но и не попадает
      # в production-CA. Для боевого домена — https://acme-v02.api.letsencrypt.org/directory.
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:-}
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile.staging:ro
