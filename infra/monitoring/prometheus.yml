# Prometheus: скрейпит /metrics у API внутри compose-сети.
# Запуск: docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: skillwharf-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: prometheus
    # Self-scrape идёт через нативный basic_auth. Файлы создаёт entrypoint
    # compose из MONITORING_BASIC_AUTH_*; в git паролей нет.
    basic_auth:
      username_file: /tmp/prometheus-auth/username
      password_file: /tmp/prometheus-auth/password
    static_configs:
      - targets: ["localhost:9090"]
