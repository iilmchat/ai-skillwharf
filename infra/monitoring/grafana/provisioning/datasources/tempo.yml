apiVersion: 1

# Источник трейсов: OTel Collector → Tempo (OTLP/gRPC :4317).
# Prometheus остаётся isDefault для метрик; Tempo подключается для Trace-панелей.
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
