# Grafana Tempo — постоянное хранилище трейсов для OTel Collector.
# Коллектор отправляет спаны по OTLP/gRPC на tempo:4317; данные лежат в
# именованном томе tempo_data, retention — 7 дней (168h).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    # Удаление блоков старше 7 суток: retention применяется compactor'ом
    # по расписанию.
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000
