# OTel Collector для локального/staging-наблюдения.
# Принимает OTLP по HTTP/gRPC и печатает спаны в stdout (docker compose logs).
# Внешние SaaS-экспортёры по умолчанию не подключены: данные не покидают хост.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
