# MCP-серверы Ozon/Wildberries (Python/SSE) и Битрикс24/МойСклад (Node/SSE).
# Запуск вместе с основным стеком:
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d --build
#
# Ключи берутся из .env:
#   OZON_CLIENT_ID, OZON_API_KEY, OZON_PERF_CLIENT_ID, OZON_PERF_CLIENT_SECRET
#   WB_API_TOKEN
#   BITRIX24_WEBHOOK_URL, MOYSKLAD_TOKEN, MOYSKLAD_BASE_URL
#   MOYSKLAD_DEFAULT_ORGANIZATION_ID, MOYSKLAD_DEFAULT_AGENT_ID
#   MCP_AUTH_TOKEN (опционально, общий Bearer-токен для /sse)
# По умолчанию MCP_ALLOW_MISSING_KEYS=1: креды могут приходить per-request
# заголовками (MCP-24.1), глобальные env-ключи не обязательны.
# 0 — healthcheck требует глобальные ключи (старое поведение).
services:
  api:
    # image нужен, чтобы файл был валидным и при запуске отдельно от базового
    # compose (например, `docker compose -f docker-compose.mcp.yml build` в CI).
    # При совместном запуске с docker-compose.yml образ собирается из build.
    image: ai-skillwharf-api:latest
    environment:
      OZON_MCP_URL: http://ozon-mcp:5001
      WB_MCP_URL: http://wb-mcp:5002
      BITRIX24_MCP_URL: http://bitrix24-mcp:5003
      MOYSKLAD_MCP_URL: http://moysklad-mcp:5004
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      # Обязательные поля заказа покупателя МойСклада (KI-080).
      MOYSKLAD_DEFAULT_ORGANIZATION_ID: ${MOYSKLAD_DEFAULT_ORGANIZATION_ID:-}
      MOYSKLAD_DEFAULT_AGENT_ID: ${MOYSKLAD_DEFAULT_AGENT_ID:-}
      MOYSKLAD_BASE_URL: ${MOYSKLAD_BASE_URL:-https://api.moysklad.ru/api/remap/1.2}

  ozon-mcp:
    build:
      context: .
      dockerfile: infra/mcp/ozon.Dockerfile
    environment:
      PORT: 5001
      DATA_DIR: /data
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      OZON_PERF_CLIENT_ID: ${OZON_PERF_CLIENT_ID:-}
      OZON_PERF_CLIENT_SECRET: ${OZON_PERF_CLIENT_SECRET:-}
      # 1 (по умолчанию) — креды приходят per-request; 0 — healthcheck требует ключи.
      MCP_ALLOW_MISSING_KEYS: ${MCP_ALLOW_MISSING_KEYS:-1}
      # 0 отключает фоновые проверки, чтобы не тратить лимиты API.
      HEALTH_CHECK_INTERVAL_MIN: ${OZON_HEALTH_CHECK_INTERVAL_MIN:-0}
    ports:
      # Только localhost: панель MCP не должна быть доступна из сети.
      - '127.0.0.1:5001:5001'
    volumes:
      - ozon_mcp_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python /usr/local/bin/mcp-healthcheck.py ozon http://127.0.0.1:5001/api/health',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  wb-mcp:
    build:
      context: .
      dockerfile: infra/mcp/wb.Dockerfile
    environment:
      PORT: 5002
      DATA_DIR: /data
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      WB_API_TOKEN: ${WB_API_TOKEN:-}
      MCP_ALLOW_MISSING_KEYS: ${MCP_ALLOW_MISSING_KEYS:-1}
      HEALTH_CHECK_INTERVAL_MIN: ${WB_HEALTH_CHECK_INTERVAL_MIN:-0}
    ports:
      # Только localhost: панель MCP не должна быть доступна из сети.
      - '127.0.0.1:5002:5002'
    volumes:
      - wb_mcp_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python /usr/local/bin/mcp-healthcheck.py wb http://127.0.0.1:5002/api/health',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bitrix24-mcp:
    build:
      context: ./infra/mcp/bitrix24
    environment:
      PORT: 5003
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOW_MISSING_KEYS: ${MCP_ALLOW_MISSING_KEYS:-1}
    ports:
      # Только localhost: MCP-сервер не публикуется во внешнюю сеть.
      - '127.0.0.1:5003:5003'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:5003/api/health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  moysklad-mcp:
    build:
      context: ./infra/mcp/moysklad
    environment:
      PORT: 5004
      MOYSKLAD_TOKEN: ${MOYSKLAD_TOKEN:-}
      MOYSKLAD_BASE_URL: ${MOYSKLAD_BASE_URL:-https://api.moysklad.ru/api/remap/1.2}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOW_MISSING_KEYS: ${MCP_ALLOW_MISSING_KEYS:-1}
    ports:
      # Только localhost: MCP-сервер не публикуется во внешнюю сеть.
      - '127.0.0.1:5004:5004'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:5004/api/health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ozon_mcp_data:
  wb_mcp_data:
