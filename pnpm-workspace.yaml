packages:
  - 'apps/*'
  - 'packages/*'

# Разрешаем только те postinstall-скрипты, которые нужны для работы зависимостей.
allowBuilds:
  # Prisma CLI и движки скачивают бинарники в postinstall.
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # argon2 ставит нативный бинарник (prebuild).
  argon2: true
  # dockerode тянет ssh2/cpu-features/protobufjs: нативные сборки не нужны,
  # сервис общается с Docker через локальный socket.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msgpackr-extract — опциональный native-ускоритель BullMQ; без него
  # используется JS-реализация, сборка не нужна.
  msgpackr-extract: false
  # @scarf/scarf — postinstall-телеметрия swagger-ui-express; не нужна.
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - '@langchain/core@1.4.0'
  - '@langchain/openai@1.8.4'
  - bullmq@6.7.6
  - '@nestjs/swagger@12.1.2'
