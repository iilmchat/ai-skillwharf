services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5432 занят другим проектом на хосте, пробрасываем свободный 5435.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      # 3000 занят другим проектом на хосте, пробрасываем свободный 3001.
      - "3001:3000"
    env_file:
      - .env
    environment:
      # Внутри compose-сети API ходит в postgres по имени сервиса, а не localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      # Контекст — корень репозитория: pnpm workspace и lockfile лежат там.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite вшивает базовый URL API на этапе сборки.
        VITE_API_URL: /api/v1
    ports:
      # Caddy слушает 80 внутри контейнера; на хосте оставляем 8080.
      - "8080:80"
    depends_on:
      - api

  # Production edge: Caddy сам получает сертификаты Let's Encrypt и
  # терминирует TLS. Запуск:
  # DOMAIN=skillwharf.example.com ACME_EMAIL=admin@example.com \
  #   docker compose --profile production up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-skillwharf.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Локальная LLM для разработки. Профиль with-llm: сервис не поднимается
  # вместе с основным стеком и не тянет образ/RAM в CI.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-llm"]
    ports:
      # 11434 обычно занят Ollama, установленным на хосте, пробрасываем 11435.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
