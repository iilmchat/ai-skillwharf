services:
  postgres:
    # pgvector: расширение `vector` нужно для долговременной памяти (RAG).
    # Тег pg16 — тот же мажор, данные из прежнего postgres:16-alpine совместимы.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5432 занят другим проектом на хосте, пробрасываем свободный 5435.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      # 3000 занят другим проектом на хосте, пробрасываем свободный 3001.
      - "3001:3000"
    env_file:
      - .env
    environment:
      # Внутри compose-сети API ходит в postgres по имени сервиса, а не localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Платёжные переменные передаются явно; значения берутся из .env.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL}
      # API ходит к sandbox-worker по внутренней сети compose.
      SANDBOX_WORKER_URL: ${SANDBOX_WORKER_URL:-http://sandbox-worker:4000}
      # Строгие лимиты по умолчанию; E2E может ослабить их через env.
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-5}
      AUTH_REGISTER_LIMIT: ${AUTH_REGISTER_LIMIT:-10}
    extra_hosts:
      # Доступ к LM Studio и другим сервисам на хосте из контейнера.
      # host-gateway нужен на Linux; на Windows и macOS работает из коробки.
      - "host.docker.internal:host-gateway"
    volumes:
      # Черновики Дзен, которые API пишет в ./dzen-output, видны на хосте.
      - ./dzen-output:/app/dzen-output
    depends_on:
      postgres:
        condition: service_healthy

  # Единственный сервис с доступом к Docker-сокету. API общается с ним по
  # HTTP, поэтому компрометация API не даёт управления хостом.
  sandbox-worker:
    build:
      context: .
      dockerfile: apps/sandbox-worker/Dockerfile
    environment:
      PORT: 4000
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-skillwharf-sandbox:latest}
      SANDBOX_ALLOW_NETWORK: ${SANDBOX_ALLOW_NETWORK:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Наружу порт не публикуется: доступ только из compose-сети.

  web:
    build:
      # Контекст — корень репозитория: pnpm workspace и lockfile лежат там.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite вшивает базовый URL API на этапе сборки.
        VITE_API_URL: /api/v1
    ports:
      # Caddy слушает 80 внутри контейнера; на хосте оставляем 8080.
      - "8080:80"
    depends_on:
      - api

  # Production edge: Caddy сам получает сертификаты Let's Encrypt и
  # терминирует TLS. Запуск:
  # DOMAIN=skillwharf.example.com ACME_EMAIL=admin@example.com \
  #   docker compose --profile production up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-skillwharf.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Локальная LLM для разработки. Профиль with-llm: сервис не поднимается
  # вместе с основным стеком и не тянет образ/RAM в CI.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-llm"]
    ports:
      # 11434 обычно занят Ollama, установленным на хосте, пробрасываем 11435.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Мониторинг: Prometheus скрейпит api:3000/metrics, Grafana показывает
  # провижиненный дашборд. Профиль monitoring — в обычном dev/CI не поднимается:
  #   docker compose --profile monitoring up -d
  # Панели доступны только с localhost.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      # Секреты не хранятся в git: значения задаются в .env.
      # Пароль нужен для self-scrape, bcrypt-хэш — для нативного web.config.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:-}
      PROMETHEUS_EXTERNAL_URL: ${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # web.config.file с basic_auth_users генерируется при старте из env,
    # чтобы bcrypt-хэш не попадал в git. Пустые креды останавливают запуск.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required (see .env.example)}"
        : "$${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required (see .env.example)}"
        : "$${MONITORING_BASIC_AUTH_HASH:?MONITORING_BASIC_AUTH_HASH is required (see .env.example)}"
        case "$${MONITORING_BASIC_AUTH_PASSWORD}" in
          admin|password|change_me|change_me_in_production)
            echo "ОШИБКА: небезопасный MONITORING_BASIC_AUTH_PASSWORD; задайте уникальный пароль." >&2
            exit 1
            ;;
          *'$$'*)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_PASSWORD не должен содержать символ доллара (ограничение Grafana provisioning)." >&2
            exit 1
            ;;
        esac
        case "$${MONITORING_BASIC_AUTH_HASH}" in
          '$$2a$$'* | '$$2b$$'* | '$$2y$$'*) ;;
          *)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_HASH должен быть bcrypt-хэшем." >&2
            exit 1
            ;;
        esac
        mkdir -p /tmp/prometheus-auth
        printf 'basic_auth_users:\n  "%s": "%s"\n' \
          "$${MONITORING_BASIC_AUTH_USER}" \
          "$${MONITORING_BASIC_AUTH_HASH}" \
          > /tmp/prometheus-auth/web.config.yml
        printf '%s' "$${MONITORING_BASIC_AUTH_USER}" > /tmp/prometheus-auth/username
        printf '%s' "$${MONITORING_BASIC_AUTH_PASSWORD}" > /tmp/prometheus-auth/password
        chmod 600 /tmp/prometheus-auth/web.config.yml /tmp/prometheus-auth/password
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION_TIME:-15d} \
          --web.config.file=/tmp/prometheus-auth/web.config.yml \
          --web.listen-address=0.0.0.0:9090 \
          --web.external-url="$${PROMETHEUS_EXTERNAL_URL}" \
          --web.route-prefix=/
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Пароль обязателен: дефолтный admin/admin больше не используется.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana ходит в Prometheus с теми же кредами, что и оператор.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required (see .env.example)}"
        case "$${GF_SECURITY_ADMIN_PASSWORD}" in
          admin|password|change_me|change_me_in_production)
            echo "ОШИБКА: небезопасный GRAFANA_ADMIN_PASSWORD; задайте уникальный пароль." >&2
            exit 1
            ;;
        esac
        : "$${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required for the Prometheus datasource}"
        : "$${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required for the Prometheus datasource}"
        case "$${MONITORING_BASIC_AUTH_PASSWORD}" in
          *'$$'*)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_PASSWORD не должен содержать символ доллара (ограничение Grafana provisioning)." >&2
            exit 1
            ;;
        esac
        exec /run.sh
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
