services:
  postgres:
    # pgvector: расширение `vector` нужно для долговременной памяти (RAG).
    # Тег pg16 — тот же мажор, данные из прежнего postgres:16-alpine совместимы.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5432 занят другим проектом на хосте, пробрасываем свободный 5435.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot миграции (KI-007). API-реплики не запускают prisma migrate deploy;
  # они ждут успешного завершения этого сервиса. Отдельный минимальный образ
  # содержит только Prisma CLI и схему, без приложения.
  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    image: ai-skillwharf-db-migrate:latest
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # Redis для BullMQ: HITL TTL, retention checkpoint'ов и уведомления.
  # AOF включён, чтобы повторяющиеся job'ы пережили рестарт контейнера.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Наружу не публикуется: доступ только из compose-сети.

  # LangGraph/LangChain и адаптеры LLM. API общается с worker'ом по
  # внутренней сети, а worker возвращает policy/billing-решения в API.
  llm-worker:
    build:
      context: .
      dockerfile: apps/llm-worker/Dockerfile
    image: ai-skillwharf-llm-worker:latest
    env_file:
      - .env
    environment:
      LLM_WORKER_PORT: 4100
      INTERNAL_API_URL: http://api:3000/api/v1
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      # LLM_BASE_URL/LLM_MODEL/LLM_API_KEY приходят из .env.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      WB_API_TOKEN: ${WB_API_TOKEN:-}
      OZON_MCP_URL: ${OZON_MCP_URL:-}
      WB_MCP_URL: ${WB_MCP_URL:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      # Egress worker'а: внешние LLM, Telegram, Google и Midjourney — только эти домены.
      OUTBOUND_ALLOWLIST: ${LLM_WORKER_OUTBOUND_ALLOWLIST:-api.telegram.org,www.googleapis.com,sheets.googleapis.com,docs.googleapis.com,oauth2.googleapis.com,api.ttapi.io,api-performance.ozon.ru,discounts-prices-api.wildberries.ru,ocr.api.cloud.yandex.net,llm.api.cloud.yandex.net,iam.api.cloud.yandex.net,ngw.devices.sberbank.ru,gigachat.devices.sberbank.ru}
    extra_hosts:
      # LLM на хосте (LM Studio/Ollama) доступна так же, как из API.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4100/v1/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Порт наружу не публикуется: доступ только из compose-сети.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ai-skillwharf-api:latest
    ports:
      # 3000 занят другим проектом на хосте, пробрасываем свободный 3001.
      - "3001:3000"
    env_file:
      - .env
    environment:
      # Внутри compose-сети API ходит в postgres по имени сервиса, а не localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Платёжные переменные передаются явно; значения берутся из .env.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL}
      # API ходит к sandbox-worker по внутренней сети compose.
      SANDBOX_WORKER_URL: ${SANDBOX_WORKER_URL:-http://sandbox-worker:4000}
      # LLM-инференс и LangGraph вынесены в отдельный сервис.
      LLM_WORKER_URL: ${LLM_WORKER_URL:-http://llm-worker:4100}
      # Общий токен внутренней сети API ↔ llm-worker (не публикуется наружу).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      # BullMQ: HITL TTL, retention и уведомления.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Снапшоты финансового дашборда (GET /finance/*): TTL записей.
      FINANCE_SNAPSHOT_TTL_SECONDS: ${FINANCE_SNAPSHOT_TTL_SECONDS:-604800}
      # Telegram: бот, секрет webhook и лимит запросов на IP.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_RATE_LIMIT: ${TELEGRAM_WEBHOOK_RATE_LIMIT:-120}
      # Google Workspace OAuth: клиент, redirect и scopes.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-}
      GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET:-}
      # Документы/OCR: SDE-совместимый HTTP API или локальный tesseract
      # в образе skillwharf-sandbox (fallback).
      OCR_API_URL: ${OCR_API_URL:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_API_AUTH_HEADER: ${OCR_API_AUTH_HEADER:-Authorization}
      # `-` вместо `:-`: пустой префикс — валидная схема (ключ без `Bearer`).
      OCR_API_AUTH_PREFIX: ${OCR_API_AUTH_PREFIX-Bearer}
      OCR_API_TIMEOUT_MS: ${OCR_API_TIMEOUT_MS:-60000}
      OCR_MAX_POLL_ATTEMPTS: ${OCR_MAX_POLL_ATTEMPTS:-10}
      OCR_POLL_INTERVAL_MS: ${OCR_POLL_INTERVAL_MS:-2000}
      OCR_TESSERACT_ENABLED: ${OCR_TESSERACT_ENABLED:-true}
      OCR_TESSERACT_LANG: ${OCR_TESSERACT_LANG:-rus+eng}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-8388608}
      # Документы агента: каталог входящих файлов и результатов DOCX.
      DOCUMENTS_INPUT_DIR: ${DOCUMENTS_INPUT_DIR:-/app/documents}
      DOCUMENTS_OUTPUT_DIR: ${DOCUMENTS_OUTPUT_DIR:-/app/docx-output}
      DOCUMENTS_MAX_BYTES: ${DOCUMENTS_MAX_BYTES:-10485760}
      DOCUMENTS_MAX_PAGES: ${DOCUMENTS_MAX_PAGES:-50}
      DOCUMENTS_MAX_TEXT_CHARS: ${DOCUMENTS_MAX_TEXT_CHARS:-100000}
      # Midjourney: TTAPI, эндпоинты зафиксированы в коде (домен в allowlist).
      MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY:-}
      MIDJOURNEY_POLL_INTERVAL_MS: ${MIDJOURNEY_POLL_INTERVAL_MS:-2000}
      MIDJOURNEY_TIMEOUT_MS: ${MIDJOURNEY_TIMEOUT_MS:-120000}
      # Отдельные хосты финансовых API (не Seller/Marketplace).
      OZON_PERFORMANCE_API_BASE_URL: ${OZON_PERFORMANCE_API_BASE_URL:-https://api-performance.ozon.ru}
      WB_PRICING_API_BASE_URL: ${WB_PRICING_API_BASE_URL:-https://discounts-prices-api.wildberries.ru}
      # Календарь по умолчанию для google_calendar_create.
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      # Полный URL веб-приложения для возврата после OAuth (пусто — JSON).
      GOOGLE_OAUTH_SUCCESS_REDIRECT: ${GOOGLE_OAUTH_SUCCESS_REDIRECT:-}
      # Ключ AES-256-GCM для refresh/access-токенов (base64, 32 байта).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      TOKEN_ENCRYPTION_KEY_ID: ${TOKEN_ENCRYPTION_KEY_ID:-local-v1}
      # Egress API: Telegram и Google — только эти домены.
      OUTBOUND_ALLOWLIST: ${API_OUTBOUND_ALLOWLIST:-api.telegram.org,www.googleapis.com,oauth2.googleapis.com,sheets.googleapis.com,docs.googleapis.com,api.ttapi.io,api-performance.ozon.ru,discounts-prices-api.wildberries.ru,ocr.api.cloud.yandex.net,api.tavily.com}
      # Повторы 429/5xx внешних провайдеров (экспоненциальный backoff).
      PROVIDER_RETRY_MAX_ATTEMPTS: ${PROVIDER_RETRY_MAX_ATTEMPTS:-3}
      PROVIDER_RETRY_BASE_DELAY_MS: ${PROVIDER_RETRY_BASE_DELAY_MS:-500}
      PROVIDER_RETRY_MAX_DELAY_MS: ${PROVIDER_RETRY_MAX_DELAY_MS:-5000}
      PROVIDER_RETRY_MAX_AFTER_MS: ${PROVIDER_RETRY_MAX_AFTER_MS:-30000}
      # OTel включается только при заданном endpoint (см. Runbook).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-skillwharf-api}
      # Sentry выключен, пока SENTRY_DSN пуст; PII фильтруется в коде.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Строгие лимиты по умолчанию; E2E может ослабить их через env.
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-5}
      AUTH_REGISTER_LIMIT: ${AUTH_REGISTER_LIMIT:-10}
    extra_hosts:
      # Доступ к LM Studio и другим сервисам на хосте из контейнера.
      # host-gateway нужен на Linux; на Windows и macOS работает из коробки.
      - "host.docker.internal:host-gateway"
    volumes:
      # Черновики Дзен, которые API пишет в ./dzen-output, видны на хосте.
      - ./dzen-output:/app/dzen-output
      # Документы: входной каталог только для чтения, DOCX — на запись.
      - ./documents:/app/documents:ro
      - ./docx-output:/app/docx-output
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      llm-worker:
        condition: service_healthy
    healthcheck:
      # Readiness: Terminus проверяет ping БД. Liveness — /api/v1/health/live.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/v1/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Единственный сервис с доступом к Docker-сокету. API общается с ним по
  # HTTP, поэтому компрометация API не даёт управления хостом.
  sandbox-worker:
    build:
      context: .
      dockerfile: apps/sandbox-worker/Dockerfile
    environment:
      PORT: 4000
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-skillwharf-sandbox:latest}
      # Egress задаётся `egress_allowlist` в манифесте навыка (deny by
      # default); глобального флага включения сети нет.
      # Пусто — профиль Docker по умолчанию (локальная разработка).
      # В staging путь задаётся в docker-compose.staging.yml.
      SANDBOX_SECCOMP_PROFILE: ${SANDBOX_SECCOMP_PROFILE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Worker читает профиль сам и передаёт демону inline JSON: путь внутри
      # контейнера worker демону Docker не виден.
      - ./sandbox/seccomp-profile.json:/etc/sandbox/seccomp-profile.json:ro
    # Наружу порт не публикуется: доступ только из compose-сети.

  web:
    build:
      # Контекст — корень репозитория: pnpm workspace и lockfile лежат там.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite вшивает базовый URL API на этапе сборки.
        VITE_API_URL: /api/v1
        # Раздел «Память» (RAG): Vite вшивает флаг на этапе сборки, поэтому
        # изменение значения требует пересборки web. По умолчанию выключен.
        VITE_RAG_MEMORY_ENABLED: ${VITE_RAG_MEMORY_ENABLED:-false}
    ports:
      # Caddy слушает 80 внутри контейнера; на хосте оставляем 8080.
      - "8080:80"
    depends_on:
      - api

  # Production edge: Caddy сам получает сертификаты Let's Encrypt и
  # терминирует TLS. Запуск:
  # DOMAIN=skillwharf.example.com ACME_EMAIL=admin@example.com \
  #   docker compose --profile production up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-skillwharf.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Локальная LLM для разработки. Профиль with-llm: сервис не поднимается
  # вместе с основным стеком и не тянет образ/RAM в CI.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-llm"]
    ports:
      # 11434 обычно занят Ollama, установленным на хосте, пробрасываем 11435.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  # OTel Collector: API отправляет OTLP-спаны на otel-collector:4318,
  # коллектор печатает их в stdout. Профиль monitoring, без внешних SaaS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      # Только localhost: OTLP-приёмник не должен быть доступен из сети.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # Мониторинг: Prometheus скрейпит api:3000/metrics, Grafana показывает
  # провижиненный дашборд. Профиль monitoring — в обычном dev/CI не поднимается:
  #   docker compose --profile monitoring up -d
  # Панели доступны только с localhost.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      # Секреты не хранятся в git: значения задаются в .env.
      # Пароль нужен для self-scrape, bcrypt-хэш — для нативного web.config.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      MONITORING_BASIC_AUTH_HASH: ${MONITORING_BASIC_AUTH_HASH:-}
      PROMETHEUS_EXTERNAL_URL: ${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # web.config.file с basic_auth_users генерируется при старте из env,
    # чтобы bcrypt-хэш не попадал в git. Пустые креды останавливают запуск.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required (see .env.example)}"
        : "$${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required (see .env.example)}"
        : "$${MONITORING_BASIC_AUTH_HASH:?MONITORING_BASIC_AUTH_HASH is required (see .env.example)}"
        case "$${MONITORING_BASIC_AUTH_PASSWORD}" in
          admin|password|change_me|change_me_in_production)
            echo "ОШИБКА: небезопасный MONITORING_BASIC_AUTH_PASSWORD; задайте уникальный пароль." >&2
            exit 1
            ;;
          *'$$'*)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_PASSWORD не должен содержать символ доллара (ограничение Grafana provisioning)." >&2
            exit 1
            ;;
        esac
        case "$${MONITORING_BASIC_AUTH_HASH}" in
          '$$2a$$'* | '$$2b$$'* | '$$2y$$'*) ;;
          *)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_HASH должен быть bcrypt-хэшем." >&2
            exit 1
            ;;
        esac
        mkdir -p /tmp/prometheus-auth
        printf 'basic_auth_users:\n  "%s": "%s"\n' \
          "$${MONITORING_BASIC_AUTH_USER}" \
          "$${MONITORING_BASIC_AUTH_HASH}" \
          > /tmp/prometheus-auth/web.config.yml
        printf '%s' "$${MONITORING_BASIC_AUTH_USER}" > /tmp/prometheus-auth/username
        printf '%s' "$${MONITORING_BASIC_AUTH_PASSWORD}" > /tmp/prometheus-auth/password
        chmod 600 /tmp/prometheus-auth/web.config.yml /tmp/prometheus-auth/password
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION_TIME:-15d} \
          --web.config.file=/tmp/prometheus-auth/web.config.yml \
          --web.listen-address=0.0.0.0:9090 \
          --web.external-url="$${PROMETHEUS_EXTERNAL_URL}" \
          --web.route-prefix=/
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Пароль обязателен: дефолтный admin/admin больше не используется.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana ходит в Prometheus с теми же кредами, что и оператор.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required (see .env.example)}"
        case "$${GF_SECURITY_ADMIN_PASSWORD}" in
          admin|password|change_me|change_me_in_production)
            echo "ОШИБКА: небезопасный GRAFANA_ADMIN_PASSWORD; задайте уникальный пароль." >&2
            exit 1
            ;;
        esac
        : "$${MONITORING_BASIC_AUTH_USER:?MONITORING_BASIC_AUTH_USER is required for the Prometheus datasource}"
        : "$${MONITORING_BASIC_AUTH_PASSWORD:?MONITORING_BASIC_AUTH_PASSWORD is required for the Prometheus datasource}"
        case "$${MONITORING_BASIC_AUTH_PASSWORD}" in
          *'$$'*)
            echo "ОШИБКА: MONITORING_BASIC_AUTH_PASSWORD не должен содержать символ доллара (ограничение Grafana provisioning)." >&2
            exit 1
            ;;
        esac
        exec /run.sh
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
