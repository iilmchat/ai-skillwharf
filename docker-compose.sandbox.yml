# Smoke-тест изоляции из scripts/test-sandbox.sh: сеть выключена, все
# capabilities сняты. Контейнеры с egress worker создаёт динамически через
# Docker API (bridge + NET_ADMIN + root-entrypoint sandbox-egress-setup.sh),
# этот сервис в таких запусках не участвует.
services:
  sandbox-runner:
    build: ./sandbox
    image: skillwharf-sandbox:latest
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    network_mode: "none"
