name: CI

on: [push, pull_request]

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm нужен до setup-node: cache: pnpm читает pnpm-lock.yaml.
      # Версия берётся из поля packageManager в package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        run: pnpm exec markdownlint-cli2 "*.md" "docs/**/*.md"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build:api

      - name: Build Web UI
        run: pnpm --filter web build

      - name: Test
        run: pnpm test

      - name: Test Docker Build
        run: docker compose build api

      - name: Test Sandbox Worker Build
        run: docker compose build sandbox-worker

      - name: Test Sandbox Isolation
        run: bash scripts/test-sandbox.sh

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          # E2E не зависит от внешней LLM: с пустыми значениями API отвечает
          # эхо-заглушкой, и тест проверяет доставку ответа в UI.
          sed -i 's|^LLM_BASE_URL=.*|LLM_BASE_URL=|' .env
          sed -i 's|^LLM_MODEL=.*|LLM_MODEL=|' .env
          # E2E делает больше 5 логинов за минуту с одного IP.
          echo 'AUTH_LOGIN_LIMIT=100' >> .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
