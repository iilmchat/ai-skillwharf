name: CI

on: [push, pull_request]

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm нужен до setup-node: cache: pnpm читает pnpm-lock.yaml.
      # Версия берётся из поля packageManager в package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        run: pnpm exec markdownlint-cli2 "*.md" "docs/**/*.md"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm build:api

      - name: Build Web UI
        run: pnpm --filter web build

      - name: Test
        run: pnpm test

      - name: Test Docker Build
        run: docker compose build api

      - name: Test Sandbox Isolation
        run: bash scripts/test-sandbox.sh
